<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="義消總隊119火鳳凰徽章">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d766"/>
      <stop offset="1" stop-color="#c8930f"/>
    </linearGradient>
    <radialGradient id="skyBase" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0a4bb0"/>
      <stop offset="1" stop-color="#001c49"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d99a12"/>
      <stop offset="1" stop-color="#ffe488"/>
    </linearGradient>

    <path id="leaf" d="M0,0 C-3.5,-7 -2.5,-14 0,-19 C2.5,-14 3.5,-7 0,0 Z"/>

    <g id="branchL">
      <path d="M60,113 Q35,110 24,90" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(50,111) rotate(-153)"/>
      <use href="#leaf" transform="translate(40,106) rotate(-147)"/>
      <use href="#leaf" transform="translate(31,99) rotate(-135)"/>
      <use href="#leaf" transform="translate(24,90) rotate(-125)"/>
    </g>
  </defs>

  <!-- 台東藍底 -->
  <circle cx="60" cy="60" r="57" fill="url(#skyBase)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="url(#ring)" stroke-width="3"/>

  <!-- 119 -->
  <text x="60" y="23" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="800" font-size="15" fill="url(#gold)">119</text>

  <!-- 花環 -->
  <g fill="url(#gold)">
    <use href="#branchL"/>
    <g transform="translate(120,0) scale(-1,1)"><use href="#branchL"/></g>
  </g>
  <g fill="url(#gold)">
    <circle cx="55" cy="112" r="3.4"/>
    <circle cx="60" cy="115" r="3.8"/>
    <circle cx="65" cy="112" r="3.4"/>
  </g>

  <!-- 鳳凰主體 -->
  <g transform="translate(60,68) scale(0.72) translate(-60,-60)" fill="url(#gold)">

    <!-- 尾羽 -->
    <path d="M52,66 C40,80 34,96 40,108 C46,98 50,86 56,70 Z"/>
    <path d="M58,66 C54,84 56,100 60,116 C64,100 66,84 62,66 Z"/>
    <path d="M68,66 C80,80 86,96 80,108 C74,98 70,86 64,70 Z"/>

    <!-- 左翼 -->
    <path d="M50,48 C36,50 22,46 10,34 C18,36 26,34 32,28 C22,24 14,18 8,8 C20,14 30,16 38,22 C40,30 44,38 50,48 Z"/>
    <!-- 右翼 -->
    <path d="M70,48 C84,50 98,46 110,34 C102,36 94,34 88,28 C98,24 106,18 112,8 C100,14 90,16 82,22 C80,30 76,38 70,48 Z"/>

    <!-- 身軀與頭部 -->
    <path d="M60,14 C66,26 72,34 70,46 C69,54 66,58 60,64 C54,58 51,54 50,46 C48,34 54,26 60,14 Z"/>
    <!-- 喙 -->
    <path d="M68,22 L78,19 L70,28 Z"/>
  </g>
</svg>
